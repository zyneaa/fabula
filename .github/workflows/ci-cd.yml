name: Fabula CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE_NAME: malangaungja/fabula
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "20"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest tests/ -v --tb=short

      - name: Run Ruff lint
        run: ruff check app/ tests/ --output-format=github

      - name: Check Ruff formatting
        run: ruff format app/ tests/ --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Run frontend lint
        working-directory: client
        run: npm run lint

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Build backend image
        run: docker build --tag fabula-backend:test --file Dockerfile .

      - name: Build frontend image
        run: docker build --tag fabula-frontend:test --file client/Dockerfile client

  security-scan:
    name: Pre-deployment Trivy Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan source, dependencies, and secrets
        id: trivy-fs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-fs-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan Docker and Compose configuration
        id: trivy-config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            trivy-fs-results.sarif
            trivy-config-results.sarif
          retention-days: 30
          if-no-files-found: warn

      - name: Enforce Trivy results
        if: always()
        run: |
          set -euo pipefail

          for report in trivy-fs-results.sarif trivy-config-results.sarif; do
            if [ ! -f "$report" ]; then
              echo "Missing Trivy report: $report"
              exit 1
            fi
          done

          HIGH_OR_CRITICAL=0

          for report in trivy-fs-results.sarif trivy-config-results.sarif; do
            count="$(python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)

          count = 0
          for run in data.get("runs", []):
              rules = {
                  rule.get("id"): rule
                  for rule in run.get("tool", {}).get("driver", {}).get("rules", [])
              }
              for result in run.get("results", []):
                  rule = rules.get(result.get("ruleId"), {})
                  tags = {
                      str(tag).upper()
                      for tag in rule.get("properties", {}).get("tags", [])
                  }
                  if "HIGH" in tags or "CRITICAL" in tags:
                      count += 1

          print(count)
          PY
            )"
            echo "$report: $count HIGH/CRITICAL findings"
            HIGH_OR_CRITICAL=$((HIGH_OR_CRITICAL + count))
          done

          if [ "$HIGH_OR_CRITICAL" -gt 0 ]; then
            echo "Found $HIGH_OR_CRITICAL HIGH/CRITICAL Trivy findings. Blocking deployment."
            exit 1
          fi

          echo "No HIGH/CRITICAL Trivy findings detected. LOW findings do not block deployment."

  build-and-push-images:
    name: Build and Push Docker Hub Images
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAME }}:backend-${{ github.sha }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}:backend-latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAME }}:frontend-${{ github.sha }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}:frontend-latest

  deploy-and-scan-on-vps:
    name: Deploy and Scan on VPS
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate deployment inputs
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "VPS_HOST is not configured"; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER is not configured"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is not configured"; exit 1; }
          test -n "$DOCKERHUB_USERNAME" || { echo "DOCKERHUB_USERNAME is not configured"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "DOCKERHUB_TOKEN is not configured"; exit 1; }
          test -f docker-compose.production.yml || { echo "docker-compose.production.yml is missing"; exit 1; }
          test -f maintenance-on.sh || { echo "maintenance-on.sh is missing"; exit 1; }
          test -f maintenance-off.sh || { echo "maintenance-off.sh is missing"; exit 1; }

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Package scanner source without VPS secrets or reports
        run: |
          tar \
            --exclude='fabula_scanner/.env' \
            --exclude='fabula_scanner/.venv' \
            --exclude='fabula_scanner/reports' \
            --exclude='fabula_scanner/__pycache__' \
            -czf fabula-scanner-source.tar.gz \
            fabula_scanner

      - name: Create remote deployment and security-response script
        run: |
          cat > deploy-and-scan.sh <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail

          DEPLOY_DIR=/var/www/fabula
          SCANNER_DIR=/var/www/fabula_scanner
          COMPOSE_FILE=docker-compose.production.yml
          BACKEND_TAG="${1:?backend tag is required}"
          FRONTEND_TAG="${2:?frontend tag is required}"

          cd "$DEPLOY_DIR"
          test -f .env.deploy || { echo ".env.deploy is missing"; exit 1; }
          test -f "$COMPOSE_FILE" || { echo "$COMPOSE_FILE is missing"; exit 1; }
          test -x "$SCANNER_DIR/.venv/bin/python" || { echo "Scanner virtualenv is missing"; exit 1; }
          test -f "$SCANNER_DIR/.env" || { echo "Scanner .env is missing"; exit 1; }

          export DOCKERHUB_IMAGE_NAME=malangaungja/fabula
          export FABULA_BACKEND_TAG="$BACKEND_TAG"
          export FABULA_FRONTEND_TAG="$FRONTEND_TAG"

          set -a
          . "$SCANNER_DIR/.env"
          set +a
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "TELEGRAM_BOT_TOKEN is missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "TELEGRAM_CHAT_ID is missing"; exit 1; }

          TARGET_URL="$(sed -n 's/^TARGET_URL=//p' .env.deploy | tail -n 1)"
          test -n "$TARGET_URL" || { echo "TARGET_URL must be in .env.deploy"; exit 1; }
          TARGET_URL="${TARGET_URL%/}"

          send_message() {
            local text="$1"
            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${text}" \
              >/dev/null
          }

          send_document() {
            local file="$1"
            local caption="$2"
            test -f "$file" || return 0
            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${file}" \
              -F "caption=${caption}" \
              >/dev/null
          }

          enable_maintenance() {
            if [ -x "$DEPLOY_DIR/maintenance-on.sh" ]; then
              "$DEPLOY_DIR/maintenance-on.sh"
            else
              touch "$DEPLOY_DIR/maintenance.flag"
              nginx -t && systemctl reload nginx
            fi
          }

          disable_maintenance() {
            if [ -x "$DEPLOY_DIR/maintenance-off.sh" ]; then
              "$DEPLOY_DIR/maintenance-off.sh"
            else
              rm -f "$DEPLOY_DIR/maintenance.flag"
              nginx -t && systemctl reload nginx
            fi
          }

          report_failure() {
            local reason="$1"
            local report_base="$2"
            enable_maintenance
            local alert_message
            alert_message="$(cat <<EOF
          FABULA SECURITY ALERT

          Status: MAINTENANCE MODE ENABLED
          Target: ${TARGET_URL}
          Reason: ${reason}
          Backend tag: ${BACKEND_TAG}
          Frontend tag: ${FRONTEND_TAG}

          Full JSON and HTML reports are attached when available.
          EOF
          )"
            send_message "$alert_message"
            send_document "${report_base}.json" "Fabula security JSON report: ${reason}"
            send_document "${report_base}.html" "Fabula security HTML report: ${reason}"
          }

          docker compose --env-file .env.deploy -f "$COMPOSE_FILE" -p fabula pull
          docker compose --env-file .env.deploy -f "$COMPOSE_FILE" -p fabula up -d
          docker compose --env-file .env.deploy -f "$COMPOSE_FILE" -p fabula exec -T backend alembic upgrade head

          backend_healthy=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/health >/dev/null; then
              backend_healthy=true
              break
            fi
            sleep 5
          done

          if [ "$backend_healthy" != true ]; then
            docker compose --env-file .env.deploy -f "$COMPOSE_FILE" -p fabula ps
            docker compose --env-file .env.deploy -f "$COMPOSE_FILE" -p fabula logs --tail=100 backend
            report_failure "Backend health check failed" "$SCANNER_DIR/reports/deployment-failure"
            exit 1
          fi

          mkdir -p "$SCANNER_DIR/reports"
          report_base="$SCANNER_DIR/reports/live-scan-$(date -u +%Y%m%dT%H%M%SZ)"
          scanner_rc=0
          (
            cd "$SCANNER_DIR"
            .venv/bin/python fabula.py \
              --target "$TARGET_URL" \
              --output "$report_base" \
              --format both \
              --no-telegram
          ) > "${report_base}.log" 2>&1 || scanner_rc=$?

          if [ ! -f "${report_base}.json" ]; then
            report_failure "Scanner failed with exit code ${scanner_rc} and produced no JSON report" "$report_base"
            exit 1
          fi

          critical="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("summary", {}).get("critical", 0))' < "${report_base}.json")"
          high="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("summary", {}).get("high", 0))' < "${report_base}.json")"
          medium="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("summary", {}).get("medium", 0))' < "${report_base}.json")"
          low="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("summary", {}).get("low", 0))' < "${report_base}.json")"
          info="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("summary", {}).get("info", 0))' < "${report_base}.json")"

          summary="$(cat <<EOF
          Fabula security scan

          Target: ${TARGET_URL}
          Backend: ${BACKEND_TAG}
          Frontend: ${FRONTEND_TAG}

          CRITICAL: ${critical}
          HIGH: ${high}
          MEDIUM: ${medium}
          LOW: ${low}
          INFO: ${info}
          EOF
          )"

          if [ "$scanner_rc" -ne 0 ] || [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
            report_failure "Critical/High findings or scanner failure" "$report_base"
            send_message "$(printf '%s\n\n%s' "$summary" "Action: MAINTENANCE MODE ENABLED")"
            exit 1
          fi

          disable_maintenance
          send_message "$(printf '%s\n\n%s' "$summary" "Action: Site remains online. No Critical or High findings detected.")"
          echo "Security scan passed."
          REMOTE
          chmod +x deploy-and-scan.sh

      - name: Prepare VPS directories
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'mkdir -p /var/www/fabula /var/www/fabula_scanner/reports'

      - name: Copy production files and scanner source
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            docker-compose.production.yml maintenance-on.sh maintenance-off.sh deploy-and-scan.sh \
            "$VPS_USER@$VPS_HOST:/var/www/fabula/"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            fabula-scanner-source.tar.gz \
            "$VPS_USER@$VPS_HOST:/tmp/fabula-scanner-source.tar.gz"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'tar -xzf /tmp/fabula-scanner-source.tar.gz -C /var/www && rm -f /tmp/fabula-scanner-source.tar.gz && chmod +x /var/www/fabula/maintenance-on.sh /var/www/fabula/maintenance-off.sh /var/www/fabula/deploy-and-scan.sh'

      - name: Log in to Docker Hub on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Deploy exact images, scan on VPS, and enforce security policy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash /var/www/fabula/deploy-and-scan.sh backend-${GITHUB_SHA} frontend-${GITHUB_SHA}"

      - name: Collect VPS reports
        if: always()
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p vps-reports
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -r \
            "$VPS_USER@$VPS_HOST:/var/www/fabula_scanner/reports/." \
            vps-reports/

      - name: Upload VPS reports to GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabula-vps-security-reports
          path: vps-reports/
          retention-days: 30
          if-no-files-found: warn

  public-health-check:
    name: Check Public Fabula Health
    runs-on: ubuntu-latest
    needs: deploy-and-scan-on-vps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Check public API health endpoint
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          set -euo pipefail

          TARGET_URL="$(printf '%s' "$TARGET_URL" | tr -d '\r\n')"
          TARGET_URL="${TARGET_URL%/}"

          case "$TARGET_URL" in
            https://fabula.whitewolf2026.com) ;;
            *)
              echo "TARGET_URL is invalid. It must be an HTTPS origin without a path."
              echo "Normalized TARGET_URL length: ${#TARGET_URL}"
              exit 1
              ;;
          esac

          HEALTH_URL="${TARGET_URL}/api/health"
          echo "Checking public Fabula API health endpoint: $HEALTH_URL"

          for attempt in {1..12}; do
            if BODY="$(curl -4 --fail --show-error --silent --location \
                --connect-timeout 10 \
                --max-time 30 \
                --retry 2 \
                --retry-delay 5 \
                --retry-all-errors \
                -A 'Fabula-CI-Healthcheck/1.0' \
                "$HEALTH_URL")"; then
              if printf '%s' "$BODY" | python -c \
                  'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("status") == "ok" else 1)'; then
                echo "Public health check passed: HTTP 200 and status=ok"
                exit 0
              fi
            fi

            echo "Health attempt $attempt/12 failed; retrying in 10 seconds"
            sleep 10
          done

          echo "Public health check failed. Diagnostic response:"
          curl -4 --show-error --silent --location \
            --connect-timeout 10 \
            --max-time 30 \
            -A 'Fabula-CI-Healthcheck/1.0' \
            -D - "$HEALTH_URL" \
            -o /tmp/fabula-health-body || true
          echo '--- response body ---'
          head -c 1000 /tmp/fabula-health-body 2>/dev/null || true
          exit 1
