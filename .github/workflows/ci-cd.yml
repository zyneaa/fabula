name: Fabula CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE_NAME: fabula/fabula
  PYTHON_VERSION: "3.13"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run backend tests
        run: pytest tests/ -v --tb=short

      - name: Run Ruff lint
        run: ruff check app/ tests/ --output-format=github

      - name: Check Ruff formatting
        run: ruff format app/ tests/ --check

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ env.IMAGE_NAME }}:latest" \
            -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            .

      - name: Validate Docker image metadata
        run: |
          docker image inspect "${{ env.IMAGE_NAME }}:latest" >/dev/null
          echo "Docker image built successfully."

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: fabula_scanner/requirements.txt

      - name: Install scanner dependencies
        working-directory: fabula_scanner
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml rich colorama

      - name: Run Fabula Security Scanner
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: fabula_scanner
        run: |
          set -euo pipefail
          mkdir -p reports

          if [ -z "${TARGET_URL:-}" ]; then
            echo "TARGET_URL is not configured. A reachable deployed URL is required."
            exit 1
          fi

          python fabula.py \
            --target "$TARGET_URL" \
            --output reports/ci-scan \
            --format json

      - name: Check scan results for critical findings
        working-directory: fabula_scanner/reports
        run: |
          set -euo pipefail

          if [ ! -f ci-scan.json ]; then
            echo "ci-scan.json was not generated."
            exit 1
          fi

          CRITICAL="$(python -c 'import json, sys; print(json.load(sys.stdin).get("summary", {}).get("critical", 0))' < ci-scan.json)"
          HIGH="$(python -c 'import json, sys; print(json.load(sys.stdin).get("summary", {}).get("high", 0))' < ci-scan.json)"

          echo "Critical findings: $CRITICAL"
          echo "High findings: $HIGH"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "Critical vulnerabilities found; blocking image publication and deployment."
            exit 1
          fi

          echo "No critical vulnerabilities found."

      - name: Upload security scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: fabula_scanner/reports/
          retention-days: 30
          if-no-files-found: warn

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download security scan report
        id: download-report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: security-scan-report
          path: fabula_scanner/reports/

      - name: Generate security summary
        if: always()
        run: |
          set -euo pipefail

          REPORT="fabula_scanner/reports/ci-scan.json"
          if [ ! -f "$REPORT" ]; then
            echo "No security scan report was available."
            exit 0
          fi

          python - "$REPORT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              data = json.load(report_file)

          summary = data.get("summary", {})
          print("=== Security Scan Summary ===")
          print(f"Target: {data.get('target', 'N/A')}")
          print(f"Total Findings: {sum(summary.values())}")
          print(f"  Critical: {summary.get('critical', 0)}")
          print(f"  High: {summary.get('high', 0)}")
          print(f"  Medium: {summary.get('medium', 0)}")
          print(f"  Low: {summary.get('low', 0)}")
          print(f"  Info: {summary.get('info', 0)}")
          PY

  build-and-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 30
          if-no-files-found: warn

      - name: Check Trivy scan results for critical issues
        run: |
          set -euo pipefail

          if [ ! -f trivy-results.sarif ]; then
            echo "Trivy scan did not produce results."
            exit 1
          fi

          CRITICAL=$(cat trivy-results.sarif | python -c 'import sys,json; d=json.load(sys.stdin); print(sum(1 for r in d.get("results",[]) if r.get("severity","").upper()=="CRITICAL"))' 2>/dev/null || echo "0")

          if [ "$CRITICAL" -gt 0 ]; then
            echo "CRITICAL: Trivy found $CRITICAL critical vulnerability(s). Blocking image push."
            exit 1
          fi

          echo "Trivy scan passed - no critical vulnerabilities."

      - name: Build and push backend image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push frontend image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAME }}:frontend-latest
            ${{ env.DOCKERHUB_IMAGE_NAME }}:frontend-${{ github.sha }}

      - name: Build and push backend image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "VPS_HOST is not configured"; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER is not configured"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is not configured"; exit 1; }
          test -f docker-compose.yml || { echo "docker-compose.yml is missing"; exit 1; }

      - name: Create SSH configuration
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Create deployment script
        run: |
          cat > deploy.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          cd "$HOME/fabula"

          echo "Pulling latest Docker images..."
          docker compose pull

          echo "Starting updated containers..."
          docker compose up -d --remove-orphans

          echo "Running database migrations..."
          docker compose exec -T backend alembic upgrade head

          echo "Waiting for application health check..."
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then
              echo "Deployment successful."
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed."
          docker compose ps
          docker compose logs --tail=100 backend
          exit 1
          EOF

          chmod +x deploy.sh

      - name: Prepare VPS directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" \
            'mkdir -p "$HOME/fabula"'

      - name: Copy deployment files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            docker-compose.yml deploy.sh \
            "$VPS_USER@$VPS_HOST:~/fabula/"

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" \
            'bash "$HOME/fabula/deploy.sh"'

      - name: Wait for health check
        run: |
          echo "Waiting for application health check..."
          sleep 10

      - name: Check local health
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:8000/health >/dev/null 2>&1; then
              echo "Local health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "Local health check failed."
          exit 1

      - name: Check public health
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if curl --fail --silent "$TARGET_URL/health" >/dev/null 2>&1; then
              echo "Public health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "Public health check failed."
          exit 1

      - name: Run Fabula live scanner
        id: live_scan
        continue-on-error: true
        working-directory: fabula_scanner
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          mkdir -p reports

          python fabula.py \
            --target "$TARGET_URL" \
            --output reports/live-scan \
            --format json \
            2>&1 | tee live-scan.log

          if grep -Eqi \
            'No response|Could not fetch target|Could not fetch target URL|No IP resolved|Could not resolve target' \
            live-scan.log; then
            echo "The scanner could not complete a valid live scan."
            exit 1
          fi

      - name: Respond to live-scan result
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          send_telegram() {
            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$1" \
              >/dev/null
          }

          if [ "${{ steps.live_scan.outcome }}" != "success" ]; then
            send_telegram "Fabula live security scan FAILED or could not reach the target. The result is not a clean scan. Review GitHub Actions immediately."
            exit 1
          fi

          REPORT="fabula_scanner/reports/live-scan.json"
          if [ ! -f "$REPORT" ]; then
            send_telegram "Fabula live security scan produced no report. The deployment requires investigation."
            exit 1
          fi

          CRITICAL="$(python -c 'import json,sys; print(json.load(sys.stdin).get("summary", {}).get("critical", 0))' < "$REPORT")"
          SENSITIVE="$(python -c 'import json,sys; print(json.load(sys.stdin).get("summary", {}).get("sensitive", 0))' < "$REPORT")"

          echo "Critical findings: $CRITICAL"
          echo "Sensitive findings: $SENSITIVE"

          if [ "$CRITICAL" -gt 0 ] || [ "$SENSITIVE" -gt 0 ]; then
            send_telegram "CRITICAL Fabula vulnerability detected. Enabling maintenance mode on the Vultr deployment. Critical: ${CRITICAL}; Sensitive: ${SENSITIVE}. Review the GitHub Actions artifact and logs."

            ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "$VPS_USER@$VPS_HOST" \
              'cd "$HOME/fabula" && ./maintenance-on.sh'

            exit 1
          fi

          send_telegram "Fabula deployment completed and live security scan found no Critical or Sensitive findings."

      - name: Notify deployment success
        if: success()
        run: echo "Deployment to VPS completed successfully."

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "Deployment failed. Review the deploy job logs."
          exit 1