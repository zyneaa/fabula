name: Fabula CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE_NAME: bakawolf/fabula
  PYTHON_VERSION: "3.13"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run backend tests
        run: pytest tests/ -v --tb=short

      - name: Run Ruff lint
        run: ruff check app/ tests/ --output-format=github

      - name: Check Ruff formatting
        run: ruff format app/ tests/ --check

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ env.IMAGE_NAME }}:latest" \
            -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            .

      - name: Validate Docker image metadata
        run: |
          docker image inspect "${{ env.IMAGE_NAME }}:latest" >/dev/null
          echo "Docker image built successfully."

  security-scan:
    name: Pre-deployment Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-secret-results.sarif
          severity: "CRITICAL,HIGH"
          secrets: true
          ignore-unfixed: true

      - name: Run Trivy Docker/Compose configuration scan
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p reports

          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format json \
            . > reports/trivy-config.json || true

          trivy compose \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format json \
            docker-compose.yml > reports/trivy-compose.json || true

      - name: Upload all Trivy scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-all-scans
          path: |
            trivy-fs-results.sarif
            trivy-secret-results.sarif
            trivy-config-results.sarif
            trivy-compose-results.sarif
          retention-days: 30
          if-no-files-found: warn

      - name: Check Trivy findings
        run: |
          set -euo pipefail

          TOTAL_CRITICAL=0

          for f in trivy-fs-results.sarif trivy-secret-results.sarif trivy-config-results.sarif trivy-compose-results.sarif; do
            if [ -f "$f" ]; then
              CRITICAL=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(sum(1 for r in d.get('results',[]) if r.get('severity','').upper() in ('CRITICAL','HIGH')))" "$f" 2>/dev/null || echo "0")
              echo "$f: $CRITICAL critical/high findings"
              TOTAL_CRITICAL=$((TOTAL_CRITICAL + CRITICAL))
            fi
          done

          if [ "$TOTAL_CRITICAL" -gt 0 ]; then
            echo "CRITICAL: Found $TOTAL_CRITICAL critical/high issues. Blocking deployment."
            exit 1
          fi

          echo "No critical/high issues found."

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download security scan report
        id: download-report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: trivy-all-scans
          path: trivy-reports/

      - name: Generate security summary
        if: always()
        run: |
          set -euo pipefail
          echo "=== Security Scan Summary ==="
          echo "All scans completed. Check artifacts for details."

  build-and-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push frontend image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAME }}:frontend-latest
            ${{ env.DOCKERHUB_IMAGE_NAME }}:frontend-${{ github.sha }}

      - name: Build and push backend image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to Vultr VPS
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "VPS_HOST is not configured"; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER is not configured"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is not configured"; exit 1; }
          test -f docker-compose.yml || { echo "docker-compose.yml is missing"; exit 1; }

      - name: Create SSH configuration
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Create deployment script
        run: |
          cat > deploy.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          cd /var/www/fabula

          export COMPOSE_PROJECT_NAME=fabula

          set -a
          . ./.env.deploy
          set +a

          # Ensure DATABASE_URL is set
          if [ -z "${DATABASE_URL:-}" ]; then
            DATABASE_URL="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
          fi

          echo "Starting all services..."
          docker compose -p fabula --env-file .env.deploy up -d

          echo "Waiting for services to be ready..."
          sleep 15

          echo "Running database migrations..."
          docker compose -p fabula exec -T -e DATABASE_URL="${DATABASE_URL}" backend python -m alembic upgrade head

          echo "Waiting for application health check..."
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then
              echo "Deployment successful."
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed."
          docker compose -p fabula ps
          docker compose -p fabula logs --tail=100 backend
          exit 1
          EOF

          chmod +x deploy.sh

      - name: Prepare VPS directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" \
            'mkdir -p /var/www/fabula && chown -R "$VPS_USER":"$VPS_USER" /var/www/fabula'

      - name: Copy deployment files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            docker-compose.yml deploy.sh \
            "$VPS_USER@$VPS_HOST:/var/www/fabula/"

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" \
            'bash /var/www/fabula/deploy.sh'

      - name: Check local health
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:8000/health >/dev/null 2>&1; then
              echo "Local health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "Local health check failed."
          exit 1

  public-health-check:
    name: Check Public Website Health
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check public health endpoint
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          set -euo pipefail
          echo "Waiting for public endpoint..."
          sleep 10
          for attempt in {1..10}; do
            if curl --fail --silent "$TARGET_URL/health" >/dev/null 2>&1; then
              echo "Public health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Public health check failed."
          exit 1

  live-security-scan:
    name: Run Fabula Live Scanner
    runs-on: ubuntu-latest
    needs: public-health-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: fabula_scanner/requirements.txt

      - name: Install scanner dependencies
        working-directory: fabula_scanner
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml rich colorama

      - name: Run Fabula live scanner
        id: live_scan
        continue-on-error: true
        working-directory: fabula_scanner
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          mkdir -p reports

          python fabula.py \
            --target "$TARGET_URL" \
            --output reports/live-scan \
            --format json \
            2>&1 | tee live-scan.log

          if grep -Eqi \
            'No response|Could not fetch target|Could not fetch target URL|No IP resolved|Could not resolve target' \
            live-scan.log; then
            echo "The scanner could not complete a valid live scan."
            exit 1
          fi

      - name: Upload live scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-scan-report
          path: fabula_scanner/reports/
          retention-days: 30
          if-no-files-found: warn

  live-scan-response:
    name: Respond to Live Scan Result
    runs-on: ubuntu-latest
    needs: live-security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download live scan report
        id: download-report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: live-scan-report
          path: fabula_scanner/reports/

      - name: Respond to live-scan result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          send_telegram() {
            curl --fail --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$1" \
              >/dev/null
          }

          if [ "${{ needs.live-security-scan.result }}" != "success" ]; then
            send_telegram "Fabula live security scan FAILED or could not reach the target. The result is not a clean scan. Review GitHub Actions immediately."
            exit 1
          fi

          REPORT="fabula_scanner/reports/live-scan.json"
          if [ ! -f "$REPORT" ]; then
            send_telegram "Fabula live security scan produced no report. The deployment requires investigation."
            exit 1
          fi

          CRITICAL="$(python -c 'import json,sys; print(json.load(sys.stdin).get("summary", {}).get("critical", 0))' < "$REPORT")"
          SENSITIVE="$(python -c 'import json,sys; print(json.load(sys.stdin).get("summary", {}).get("sensitive", 0))' < "$REPORT")"

          echo "Critical findings: $CRITICAL"
          echo "Sensitive findings: $SENSITIVE"

          if [ "$CRITICAL" -gt 0 ] || [ "$SENSITIVE" -gt 0 ]; then
            send_telegram "CRITICAL: Fabula live scan found a sensitive vulnerability. Enabling maintenance mode on the Vultr deployment. Critical: ${CRITICAL}; Sensitive: ${SENSITIVE}. Review GitHub Actions artifact: live-scan-report. Target: ${{ secrets.TARGET_URL }}"

            ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "$VPS_USER@$VPS_HOST" \
              'cd "$HOME/fabula" && ./maintenance-on.sh'

            exit 1
          fi

          send_telegram "Fabula deployment completed and live security scan found no Critical or Sensitive findings."