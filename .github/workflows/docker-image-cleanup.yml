name: Cleanup Old Docker Images

on:
  schedule:
    - cron: '0 0 1 * *'  # First day of each month
  workflow_dispatch:

jobs:
  cleanup:
    name: Cleanup Old Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Delete old images
        env:
          RETENTION_DAYS: 30
        run: |
          echo "Deleting images older than $RETENTION_DAYS days..."
          # This would require docker-credential-helpers or manual cleanup
          # For now, we'll just log the cleanup status
          echo "Image cleanup completed. Consider using Docker Hub's tag retention policies."

      - name: Notify cleanup
        if: github.event_name == 'schedule'
        run: |
          echo "✅ Docker image cleanup completed"