services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
    volumes:
      - fabula_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fabula-network

  backend:
    image: "${DOCKERHUB_IMAGE_NAME:-malangaungja/fabula}:${FABULA_BACKEND_TAG:-backend-latest}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-60}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}"
      DEFAULT_LLM_MODEL: "${DEFAULT_LLM_MODEL:-google/gemma-4-26b-a4b-it}"
      UPLOAD_DIR: "${UPLOAD_DIR:-./uploads}"
      MAX_UPLOAD_SIZE_MB: "${MAX_UPLOAD_SIZE_MB:-50}"
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS is required}"
      PYTHONPATH: /app
    volumes:
      - fabula_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - fabula-network

  frontend:
    image: "${DOCKERHUB_IMAGE_NAME:-malangaungja/fabula}:${FABULA_FRONTEND_TAG:-frontend-latest}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost/ >/dev/null || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - fabula-network

volumes:
  fabula_postgres_data:
  fabula_uploads:

networks:
  fabula-network:
    driver: bridge