name: Fabula Security Scanner CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    name: Run Security Scanner
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          cd fabula_scanner
          pip install -r requirements.txt
          pip install pyyaml rich colorama

      - name: Run security scanner
        env:
          TARGET_URL: ${{ secrets.SCAN_TARGET_URL }}
        run: |
          cd fabula_scanner
          python fabula.py --target "$TARGET_URL" --format json