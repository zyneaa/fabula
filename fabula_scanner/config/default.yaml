# ============================================================
# FABULA SECURITY SCANNER - CONFIGURATION
# ============================================================
# IMPORTANT: Do not commit credentials to git!
# Use environment variables instead:
#   - TELEGRAM_BOT_TOKEN
#   - TELEGRAM_CHAT_ID

timeout: 5
# Wordlist for directory brute force
# Default fallback paths are embedded in the code if file not found
dir_wordlist: payloads/directories.txt
nmap_args: -sS -sV -T4 -p 21,22,25,80,443,3306,5432,6379
nmap_timeout: 20
os_detection: false
nse_scripts: false

# The deployment runs on Vultr, not AWS.
cloud_provider: vultr
cloud_metadata_check: false

# ------------------------------------------------------------
# TELEGRAM ALERTS
# ------------------------------------------------------------
telegram:
  # Bot credentials (use environment variables in production!)
  # Set these as environment variables:
  #   TELEGRAM_BOT_TOKEN=your-token-here
  #   TELEGRAM_CHAT_ID=your-chat-id-here
  # Or set in fabula_scanner/.env file
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  
  # Alert settings
  enabled: true
  alert_threshold: HIGH
  include_critical: true
  include_high: true
  include_medium: false
  include_low: false
  include_info: false
  
  # Message formatting
  show_description: true
  show_remediation: true
  show_module: true
  max_findings_per_message: 10
  truncate_description: 120
  send_summary_always: true
