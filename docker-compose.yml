services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - fabula_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fabula-network

  backend:
    image: ${DOCKERHUB_IMAGE_NAME}:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env.app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - UPLOAD_DIR=./uploads
      - MAX_UPLOAD_SIZE_MB=50
      - PYTHONPATH=/app
    volumes:
      - fabula_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fabula-network

  frontend:
    image: ${DOCKERHUB_IMAGE_NAME}:frontend-${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fabula-network

volumes:
  fabula_postgres_data:
  fabula_uploads:

networks:
  fabula-network:
    driver: bridge
